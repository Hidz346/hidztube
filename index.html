<!doctype html>
<html lang="id" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <link rel="icon" type="image/png" href="https://www.gobox.my.id/file/IcHjU.png" />
    <link rel="apple-touch-icon" href="https://www.gobox.my.id/file/IcHjU.png" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Hidz | Tube" />
    <meta property="og:description" content="Nonton anime, drama Asia, donghua, live TV, film & series, serta baca komik — semua dalam satu platform streaming gratis." />
    <meta property="og:image" content="https://www.gobox.my.id/file/IcHjU.png" />
    <meta property="og:url" content="https://nanzztube.vercel.app" />
    <meta property="og:site_name" content="HidzTube" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hidz | Tube" />
    <meta name="twitter:description" content="Nonton anime, drama Asia, donghua, live TV, film & series, serta baca komik dalam satu platform." />
    <meta name="twitter:image" content="https://www.gobox.my.id/file/IcHjU.png" />

    <title>Hidz | Tube</title>

    <!-- Fonts: Orbitron · Space Grotesk · Space Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <!-- ══════════════════════════════════════
         NAVBAR
    ══════════════════════════════════════ -->
    <header id="navbar">
      <div class="navbar-top">
        <div class="brand" id="brand-home" role="button" tabindex="0" aria-label="Beranda">
          <img src="https://www.gobox.my.id/file/IcHjU.png" alt="HidzTube" />
          <h1 class="logo-hidz">HIDZTUBE</h1>
        </div>

        <div class="navbar-actions">
          <form id="search-form" class="search-box" role="search">
            <button type="submit" class="search-icon" aria-label="Cari" style="background:none;border:0;color:var(--muted);cursor:pointer;">
              <i class="fas fa-search"></i>
            </button>
            <input type="text" id="search-input" placeholder="Cari judul..." autocomplete="off" />
          </form>
          <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Ganti tema terang/gelap">
            <span class="knob"><i class="fas fa-moon"></i></span>
          </button>
        </div>
      </div>

      <nav class="pill-strip" id="pill-strip" aria-label="Kategori">
        <button class="pill" data-cat="">Beranda</button>
        <button class="pill" data-cat="anime">Anime</button>
        <button class="pill" data-cat="drama">Drama Asia</button>
        <button class="pill" data-cat="donghua">Donghua</button>
        <button class="pill" data-cat="livetv">Live TV</button>
        <button class="pill" data-cat="vod">Film &amp; Series</button>
        <button class="pill" data-cat="manga">Komik</button>
      </nav>
    </header>

    <!-- ══════════════════════════════════════
         FIRST-LOAD LOADER
    ══════════════════════════════════════ -->
    <div id="global-loader">
      <div style="display:flex;flex-direction:column;align-items:center;">
        <i class="fas fa-circle-notch spin" style="font-size:2.6rem;color:var(--y);"></i>
        <span class="loader-label">MEMUAT...</span>
      </div>
    </div>

    <!-- ══════════════════════════════════════
         APP MOUNT (diisi oleh router)
    ══════════════════════════════════════ -->
    <main id="app"></main>

    <footer class="site-footer">
      <span>HIDZTUBE</span> — bagian dari ekosistem HidzProject. Konten diambil dari sumber pihak ketiga untuk tujuan hiburan.
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.20/hls.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
